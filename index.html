<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Truc mallorquí</title>
  </head>
  <body>
    <div id="scoreboard">
      <section class="teamScore" aria-label="Marcador de l'equip A">
        <div class="teamScoreHeading">
          <h2>Equip A</h2>
          <span class="matchScore"
            ><span id="scoreA">0</span><small>/ 18</small
            ><span
              class="baseTrack"
              id="baseTrackA"
              role="img"
              aria-label="Equip A: cap base guanyada"
              ><span class="basePoint" data-result="pending"></span
              ><span class="basePoint" data-result="pending"></span
              ><span class="basePoint" data-result="pending"></span
            ></span
          >
        </div>
        <p class="handBid">
          Punts de la mà: <span id="handBidA">1 punt · Sense aposta</span>
        </p>
        <p class="envitStatus">
          Envida:
          <span id="envitStatusA" data-state="available">Disponible</span>
        </p>
        <p class="raiseStatus">Pot pujar: <span id="raiseStatusA">—</span></p>
      </section>
      <section class="teamScore" aria-label="Marcador de l'equip B">
        <div class="teamScoreHeading">
          <h2>Equip B</h2>
          <span class="matchScore"
            ><span id="scoreB">0</span><small>/ 18</small
            ><span
              class="baseTrack"
              id="baseTrackB"
              role="img"
              aria-label="Equip B: cap base guanyada"
              ><span class="basePoint" data-result="pending"></span
              ><span class="basePoint" data-result="pending"></span
              ><span class="basePoint" data-result="pending"></span
            ></span
          >
        </div>
        <p class="handBid">
          Punts de la mà: <span id="handBidB">1 punt · Sense aposta</span>
        </p>
        <p class="envitStatus">
          Envida:
          <span id="envitStatusB" data-state="available">Disponible</span>
        </p>
        <p class="raiseStatus">Pot pujar: <span id="raiseStatusB">—</span></p>
      </section>
      <div id="spectatorStatus" aria-live="polite">Espectadors: 0/4</div>
      <div
        id="gameEvents"
        role="log"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Esdeveniments de la partida"
      ></div>
    </div>

    <div id="messages"></div>

    <div id="table">
      <div id="tableCards"></div>

      <div id="pTop" class="player pTop">
        <div class="playerName" id="nameTop"></div>
        <div class="playerLabel" id="labelTop"></div>
        <div id="pTopCards"></div>
      </div>

      <div id="pLeft" class="player pLeft">
        <div class="playerName" id="nameLeft"></div>
        <div class="playerLabel" id="labelLeft"></div>
        <div id="pLeftCards"></div>
      </div>

      <div id="pRight" class="player pRight">
        <div class="playerName" id="nameRight"></div>
        <div class="playerLabel" id="labelRight"></div>
        <div id="pRightCards"></div>
      </div>

      <div id="main" class="player">
        <div class="playerName" id="nameBottom"></div>
        <div class="playerLabel" id="labelBottom"></div>
        <div id="mainCards"></div>
      </div>
    </div>

    <button id="openBidDialog" type="button" hidden>Fer una aposta</button>
    <button id="continueHand" type="button" hidden>Continua</button>
    <dialog id="bidDialog" aria-labelledby="bidDialogTitle">
      <h2 id="bidDialogTitle">Aposta</h2>
      <p id="bidDialogMessage"></p>
      <div id="bidDialogActions"></div>
      <button id="closeBidDialog" type="button">Tanca</button>
    </dialog>
    <div class="game-controls">
      <button id="reset" type="button" hidden>Reinicia la sala</button>
    </div>

    <script type="module" src="./app.js?v=20261007-16"></script>
  </body>
</html>
