<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Truc mallorquí</title>
  </head>
  <body>
    <div id="scoreboard">
      <div class="teamScore">Equip A <span id="scoreA">0</span></div>
      <div class="teamScore">Equip B <span id="scoreB">0</span></div>
      <div id="spectatorStatus" aria-live="polite">Espectadors 0/4</div>
    </div>

    <div id="messages"></div>

    <div id="table">
      <div id="tableCards"></div>

      <div id="pTop" class="player pTop">
        <div class="playerName" id="nameTop"></div>
        <div class="playerLabel" id="labelTop"></div>
        <div id="pTopCards"></div>
      </div>

      <div id="pLeft" class="player pLeft">
        <div class="playerName" id="nameLeft"></div>
        <div class="playerLabel" id="labelLeft"></div>
        <div id="pLeftCards"></div>
      </div>

      <div id="pRight" class="player pRight">
        <div class="playerName" id="nameRight"></div>
        <div class="playerLabel" id="labelRight"></div>
        <div id="pRightCards"></div>
      </div>

      <div id="main" class="player">
        <div class="playerName" id="nameBottom"></div>
        <div class="playerLabel" id="labelBottom"></div>
        <div id="mainCards"></div>
      </div>
    </div>

    <button id="openBidDialog" type="button" hidden>Fer una aposta</button>
    <dialog id="bidDialog" aria-labelledby="bidDialogTitle">
      <h2 id="bidDialogTitle">Aposta</h2>
      <p id="bidDialogMessage"></p>
      <div id="bidDialogActions"></div>
      <button id="closeBidDialog" type="button">Tanca</button>
    </dialog>
    <div class="game-controls">
      <button id="reset" type="button" hidden>Reinicia sa sala</button>
    </div>

    <script type="module" src="./app.js?v=20261007-13"></script>
  </body>
</html>
